name: Deploy the game server

# The rooms run on Cloudflare Workers + Durable Objects. This is manual on
# purpose: the board on GitHub Pages keeps working across server deploys, and
# a redeploy resets in-flight rooms.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  - a token with "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID - your account id
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
