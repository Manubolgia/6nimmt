name = "6nimmt"
main = "src/index.js"
compatibility_date = "2025-04-01"

# Rooms are Durable Objects: one per code, holding the authoritative game.
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# SQLite-backed Durable Objects are the ones available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[observability]
enabled = true
